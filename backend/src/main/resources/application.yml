spring:
  application:
    name: process-to-flow
  ai:
    model:
      # Set to "openai" or "ollama" (env: LLM_PROVIDER)
      chat: ${LLM_PROVIDER:openai}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.2

server:
  port: 8080

process-to-flow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    # Global cap for all users per UTC day; 0 = disabled
    requests-per-day-global: ${RATE_LIMIT_PER_DAY:500}
  prompt-guard:
    enabled: ${PROMPT_GUARD_ENABLED:true}
    max-description-length: ${PROMPT_MAX_LENGTH:8000}
